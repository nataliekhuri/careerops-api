name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: careerops_user
          POSTGRES_DB: careerops
          # Throwaway CI database: trust auth means no password is stored in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U careerops_user -d careerops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: careerops
      DB_USER: careerops_user
      DB_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to a fresh database
        run: alembic upgrade head

      - name: Check models and migrations are in sync
        run: alembic check

      - name: Run tests
        run: pytest

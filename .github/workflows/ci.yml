name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: careerops_user
          POSTGRES_DB: careerops
          # Throwaway CI database: trust auth means no password is stored in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U careerops_user -d careerops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: careerops
      DB_USER: careerops_user
      DB_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to a fresh database
        run: alembic upgrade head

      - name: Check models and migrations are in sync
        run: alembic check

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway .env (random secrets, never stored)
        run: |
          password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$jwt_secret"
          umask 077
          printf 'DB_PASSWORD=%s\nJWT_SECRET_KEY=%s\n' "$password" "$jwt_secret" > .env

      - name: Build and start the stack
        run: docker compose up --build --detach

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "API did not become ready in time" >&2
          exit 1

      - name: Smoke test the API
        run: |
          set -euo pipefail
          api=http://localhost:8000
          # Unauthenticated requests are rejected.
          test "$(curl -s -o /dev/null -w '%{http_code}' $api/applications)" = "401"
          # Register, log in, then use the token.
          curl -fsS -X POST $api/auth/register -H "Content-Type: application/json" \
            -d '{"email": "ci@example.com", "password": "ci-password-123", "full_name": "CI"}' > /dev/null
          token=$(curl -fsS -X POST $api/auth/login -d "username=ci@example.com&password=ci-password-123" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"
          created=$(curl -fsS -X POST $api/applications -H "$auth" -H "Content-Type: application/json" \
            -d '{"company": "Docker Co", "position": "Backend Developer", "location": "Remote"}')
          echo "$created"
          id=$(echo "$created" | python3 -c "import sys, json; print(json.load(sys.stdin)['application']['id'])")
          curl -fsS -X PATCH "$api/applications/$id" -H "$auth" \
            -H "Content-Type: application/json" -d '{"status": "Interview"}' | grep -q '"status":"Interview"'
          curl -fsS -D - -o /dev/null "$api/applications?status=interview" -H "$auth" | grep -qi '^x-total-count: 1'
          echo "Smoke test passed"

      - name: Container runs as a non-root user
        run: test "$(docker compose exec -T api id -u)" != "0"

      # The next two steps mimic Render: one DATABASE_URL and RUN_MIGRATIONS=true.
      - name: "Render-style start: migrations on start, then serve"
        run: |
          set -euo pipefail
          . ./.env
          docker compose run --detach --no-deps --name render-style -p 8001:8000 \
            -e RUN_MIGRATIONS=true \
            -e DATABASE_URL="postgresql://careerops_user:${DB_PASSWORD}@db:5432/careerops" \
            api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health/ready; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8001/health/ready > /dev/null
          logs=$(docker logs render-style 2>&1)
          echo "$logs" | grep -q "start.sh: migrations complete."
          # The database was already migrated by the compose stack, so nothing new runs.
          if echo "$logs" | grep -q "Running upgrade"; then echo "unexpected migration" >&2; exit 1; fi
          docker rm -f render-style
          echo "Render-style start passed"

      - name: "Render-style start: failed migration stops the container"
        run: |
          set -uo pipefail
          # This command is EXPECTED to fail, so capture its exit code instead of
          # letting the step's `bash -e` stop at it.
          status=0
          docker compose run --rm --no-deps \
            -e RUN_MIGRATIONS=true \
            -e DB_CONNECT_TIMEOUT=2 \
            -e DATABASE_URL="postgresql://nobody:wrong@no-such-host:5432/nothing" \
            api > failed-start.log 2>&1 || status=$?
          cat failed-start.log
          echo "exit status: $status"
          test "$status" -ne 0
          grep -q "start.sh: migrations FAILED - not starting the API." failed-start.log
          if grep -q "Uvicorn running" failed-start.log; then echo "API started despite failed migration" >&2; exit 1; fi
          echo "Failed-migration guard passed"

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          docker logs render-style 2>&1 || true

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

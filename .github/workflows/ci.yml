name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: careerops_user
          POSTGRES_DB: careerops
          # Throwaway CI database: trust auth means no password is stored in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U careerops_user -d careerops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: careerops
      DB_USER: careerops_user
      DB_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to a fresh database
        run: alembic upgrade head

      - name: Check models and migrations are in sync
        run: alembic check

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway .env (random password, never stored)
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          umask 077
          echo "DB_PASSWORD=$password" > .env

      - name: Build and start the stack
        run: docker compose up --build --detach

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "API did not become ready in time" >&2
          exit 1

      - name: Smoke test the API
        run: |
          set -euo pipefail
          created=$(curl -fsS -X POST http://localhost:8000/applications \
            -H "Content-Type: application/json" \
            -d '{"company": "Docker Co", "position": "Backend Developer", "location": "Remote"}')
          echo "$created"
          id=$(echo "$created" | python3 -c "import sys, json; print(json.load(sys.stdin)['application']['id'])")
          curl -fsS -X PATCH "http://localhost:8000/applications/$id" \
            -H "Content-Type: application/json" -d '{"status": "Interview"}' | grep -q '"status":"Interview"'
          curl -fsS -D - -o /dev/null "http://localhost:8000/applications?status=interview" | grep -qi '^x-total-count: 1'
          echo "Smoke test passed"

      - name: Container runs as a non-root user
        run: test "$(docker compose exec -T api id -u)" != "0"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
